services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hollis
      POSTGRES_PASSWORD: hollis
      POSTGRES_USER: hollis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hollis -d hollis"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
      - hollis-postgres:/var/lib/postgresql

volumes:
  hollis-postgres:
