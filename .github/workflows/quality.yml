name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hollis
          POSTGRES_PASSWORD: hollis
          POSTGRES_USER: hollis
        options: >-
          --health-cmd "pg_isready -U hollis -d hollis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5434:5432
    timeout-minutes: 15
    steps:
      - name: Check repository actor
        env:
          AUTHORIZED_ACTOR: luch91
        run: |
          if [ "$GITHUB_ACTOR" != "$AUTHORIZED_ACTOR" ]; then
            echo "Unauthorized repository actor: $GITHUB_ACTOR"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22.22.2

      - name: Configure verified Git identity
        run: |
          git config --local user.name luch91
          git config --local user.email luchijudith@gmail.com

      - name: Restore private decision-log sentinel
        run: |
          mkdir -p .hollis
          printf '# CI sentinel\n' > .hollis/decisions.md

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify database isolation
        env:
          DATABASE_MIGRATION_URL: postgres://hollis:hollis@localhost:5434/hollis
          DATABASE_TEST_URL: postgres://hollis:hollis@localhost:5434/hollis
        run: |
          pnpm --filter @hollis/database db:prepare-test
          pnpm --filter @hollis/database db:migrate
          pnpm --filter @hollis/database test:integration
          DATABASE_URL=postgres://hollis_app:hollis_app@localhost:5434/hollis \
            pnpm --filter @hollis/api test:integration

      - name: Verify repository
        run: pnpm verify
