name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hollis_e2e
          POSTGRES_PASSWORD: hollis
          POSTGRES_USER: hollis
        options: >-
          --health-cmd "pg_isready -U hollis -d hollis_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5434:5432
    timeout-minutes: 30
    steps:
      - name: Check repository actor
        env:
          AUTHORIZED_ACTOR: luch91
        run: |
          if [ "$GITHUB_ACTOR" != "$AUTHORIZED_ACTOR" ]; then
            echo "Unauthorized repository actor: $GITHUB_ACTOR"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22.22.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure verified Git identity
        run: |
          git config --local user.name luch91
          git config --local user.email luchijudith@gmail.com

      - name: Restore private decision-log sentinel
        run: |
          mkdir -p .hollis
          printf '# CI sentinel\n' > .hollis/decisions.md

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install contract test dependencies
        run: python -m pip install -r contracts/genlayer/requirements-test.txt

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify database isolation
        env:
          DATABASE_MIGRATION_URL: postgres://hollis:hollis@localhost:5434/hollis_e2e
          DATABASE_TEST_URL: postgres://hollis:hollis@localhost:5434/hollis_e2e
        run: |
          pnpm --filter @hollis/database db:prepare-test
          pnpm --filter @hollis/database db:migrate
          pnpm --filter @hollis/database test:integration
          DATABASE_URL=postgres://hollis_app:hollis_app@localhost:5434/hollis_e2e \
            pnpm --filter @hollis/api test:integration

      - name: Verify repository
        run: pnpm verify

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Verify Python contracts and canonical vectors
        run: pnpm test:contracts

      - name: Verify browser workflows
        run: pnpm e2e

      - name: Preserve browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: ignore
          name: playwright-report-and-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
