services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hollis
      POSTGRES_PASSWORD: hollis
      POSTGRES_USER: hollis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hollis -d hollis"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hollis-postgres:/var/lib/postgresql/data

volumes:
  hollis-postgres:
